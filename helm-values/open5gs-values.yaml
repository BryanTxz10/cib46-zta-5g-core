# open5gs-values.yaml
# Valores para el chart de Gradiant (oci://registry-1.docker.io/gradiantcharts/open5gs,
# versión fijada en ansible/group_vars/all.yml) con Open5GS 2.7.x sobre k3s.
# Nota lab v2: el repo towards5gs-helm no publica chart de Open5GS; estas
# claves (hss/mme/pcrf/sgwc/sgwu, guamiList, nsiList, mongodb) son las del
# chart de Gradiant.
# PLMN de prueba: MCC 999 / MNC 70 (rango reservado para testbeds 3GPP).
#
# NOTA: las politicas de red nativas del chart (networkPolicy.enabled)
# se mantienen deshabilitadas de forma deliberada en todas las
# condiciones; el enforcement de segmentacion, identidad y autorizacion
# se implementa integramente mediante CiliumNetworkPolicy (ver
# ../cilium-policies/), no mediante el mecanismo nativo de Kubernetes
# NetworkPolicy que expone el chart.

networkPolicy:
  enabled: false

# Suscriptor de prueba. Lo inserta el Deployment "<release>-populate" del
# chart al arrancar (reemplaza a insert-subscribers.sh, que usaba el shell
# 'mongo' legado, ausente en las imágenes MongoDB actuales).
# Formato: add_ue_with_slice <IMSI> <K> <OPc> <DNN> <SST> <SD>
# Deben coincidir con ueransim-config/ue.yaml.
populate:
  enabled: true
  initCommands:
    - open5gs-dbctl add_ue_with_slice 999700000000001 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA internet 1 111111

global:
  mcc: "999"
  mnc: "70"

hss:
  enabled: false
mme:
  enabled: false
pcrf:
  enabled: false
sgwc:
  enabled: false
sgwu:
  enabled: false
# SEPP (roaming entre PLMN) no se usa en una red privada de un solo PLMN.
sepp:
  enabled: false

nrf:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 7777

amf:
  replicaCount: 1
  config:
    guamiList:
      - plmn_id:
          mcc: "999"
          mnc: "70"
        amf_id:
          region: 2
          set: 1
    taiList:
      - plmn_id:
          mcc: "999"
          mnc: "70"
        tac: [1]
    plmnList:
      - plmn_id:
          mcc: "999"
          mnc: "70"
        s_nssai:
          - sst: 1
            sd: "0x111111"

smf:
  replicaCount: 1

nssf:
  replicaCount: 1
  config:
    nsiList:
      - uri: ""
        sst: 1
        sd: "0x111111"

pcf:
  replicaCount: 1

udm:
  replicaCount: 1

udr:
  replicaCount: 1

ausf:
  replicaCount: 1

bsf:
  replicaCount: 1

scp:
  replicaCount: 1

webui:
  replicaCount: 1
  ingress:
    enabled: false

mongodb:
  # Volumen emptyDir en el testbed: los datos de suscriptores se
  # pierden ante cada reinicio del pod y deben reinsertarse. Limitacion
  # conocida y documentada, sin impacto en las metricas de seguridad
  # evaluadas.
  persistence:
    enabled: false
