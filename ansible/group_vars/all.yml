# all.yml — VARIABLES del despliegue (versiones y parámetros).
# Equivale a bootstrap/versions.env, pero en formato Ansible.
# Guía paso a paso: docs/guia-lab-desde-cero.md
# ================== REVISA / EDITA ==================
---
# --- Kubernetes / CNI ---
k3s_version: "v1.28.5+k3s1"
cilium_version: "1.15.4"
# Pool de IPs de pods de Cilium. Igual al cluster-cidr por defecto de k3s,
# para no solapar con la red de servicios (10.43.0.0/16).
cilium_pod_cidr: "10.42.0.0/16"
cilium_cli_version: "v0.16.7"
hubble_cli_version: "v0.13.3"
metrics_server_version: "v0.7.1"

# Multus (segunda interfaz macvlan para N2). DESACTIVADO en lab v2:
# N2 va por la red de pods de Cilium para que las políticas C1-C3 lo vean.
# Si lo activas, los workers necesitan una 2.a NIC y modo promiscuo.
deploy_multus: false
multus_version: "v4.0.2"
multus_master_iface: "eth1"

# --- Núcleo 5G (chart Helm de Gradiant, Open5GS 2.7.5) ---
# El repo towards5gs-helm NO publica un chart de Open5GS (solo free5GC y
# UERANSIM); los values del repo corresponden al chart de Gradiant.
open5gs_chart: "oci://registry-1.docker.io/gradiantcharts/open5gs"
open5gs_chart_version: "2.3.4"
# El nombre del release define los nombres de servicios y deployments
# (open5gs-cp-amf, open5gs-cp-nrf-sbi...). Lo usan gnb.yaml, los checks y los
# scripts de C2. No lo cambies.
open5gs_release: "open5gs-cp"

# --- Identidad (opcional; sin enforcement) ---
spire_version: "1.9.0"
deploy_spire: false                 # pon true cuando trabajemos la identidad

# --- RAN simulada ---
ueransim_version: "v3.2.6"

# --- Imágenes (PINNEA POR DIGEST para calidad-paper; ver REPRODUCIBILITY.md) ---
netshoot_image: "nicolaka/netshoot:v0.13"
ueransim_gnb_image: "towards5gs/ueransim-gnb:v3.2.6"
ueransim_ue_image: "towards5gs/ueransim-ue:v3.2.6"

# --- Parámetros del testbed ---
plmn_mcc: "999"
plmn_mnc: "70"
ns_cp: "5g-cp"
ns_ran: "5g-ran"
ns_up: "5g-up"

# Ruta del kubeconfig que crea k3s en el master (no cambiar salvo que sepas).
kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
