# ansible.cfg — configuración del proyecto CIB46.
# Hace que Ansible encuentre el inventario y se comporte de forma predecible.
[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent
deprecation_warnings = False

[privilege_escalation]
# Usamos sudo en los nodos. Si tu sudo pide contraseña, lanza el playbook con
# --ask-become-pass (ver README-ansible.md).
become = True
become_method = sudo
