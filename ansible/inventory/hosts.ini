# hosts.ini — INVENTARIO: lista de máquinas que Ansible va a configurar.
# ================== EDITA ESTO ==================
# Pon las IP de tus 3 nodos y el usuario SSH con el que entras.
# 'ansible_user' = usuario con el que te conectas por SSH y que puede hacer sudo.
# Valores por defecto = los de docs/guia-lab-desde-cero.md (red NAT
# 192.168.100.0/24 de VMware, usuario cib46).
#
# Reglas:
#   - [master]  -> el nodo control-plane de k3s (1 solo).
#   - [workers] -> los nodos trabajadores (1 o más).
#   - No cambies los nombres de los grupos (el playbook los usa).
#   - ansible_host debe ser la IP de la red del clúster (k3s la usa como
#     --node-ip y Cilium como dirección del API server).

[master]
node-master ansible_host=192.168.100.10 ansible_user=cib46

[workers]
node-worker1 ansible_host=192.168.100.11 ansible_user=cib46
node-worker2 ansible_host=192.168.100.12 ansible_user=cib46

# Grupo lógico que agrupa a todos (no editar).
[cluster:children]
master
workers
