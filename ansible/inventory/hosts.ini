# hosts.ini — INVENTARIO: lista de máquinas que Ansible va a configurar.
# ================== EDITA ESTO ==================
# Pon las IP (o nombres DNS) de tus 3 nodos y el usuario SSH con el que entras.
# 'ansible_user' = usuario con el que te conectas por SSH y que puede hacer sudo.
#
# Reglas:
#   - [master]  -> el nodo control-plane de k3s (1 solo).
#   - [workers] -> los nodos trabajadores (1 o más).
#   - No cambies los nombres de los grupos (el playbook los usa).

[master]
node-master ansible_host=192.168.1.10 ansible_user=ubuntu

[workers]
node-worker1 ansible_host=192.168.1.11 ansible_user=ubuntu
node-worker2 ansible_host=192.168.1.12 ansible_user=ubuntu

# Grupo lógico que agrupa a todos (no editar).
[cluster:children]
master
workers
