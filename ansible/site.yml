# site.yml — Despliegue completo del testbed CIB46 con Ansible.
#
# Reemplaza a bootstrap/*.sh como ORQUESTADOR: en vez de "pasos de shell",
# describe el estado deseado del clúster y lo consigue de forma idempotente
# (puedes re-ejecutarlo sin romper nada).
#
# Uso (desde la carpeta ansible/):
#   ansible-playbook site.yml                 # todo
#   ansible-playbook site.yml --ask-become-pass   # si sudo pide contraseña
#   ansible-playbook site.yml --tags cilium   # solo una parte
#
# Nota de diseño: envolvemos los instaladores oficiales (k3s, Helm) y
# kubectl/helm (que YA son idempotentes) en vez de reimplementarlos. Es un
# patrón común y robusto en testbeds de redes, y minimiza dependencias
# (solo Ansible + SSH; no hace falta la colección kubernetes.core).
---

# =====================================================================
# PLAY 1 — Preparación del host (TODOS los nodos)
# =====================================================================
- name: "Preparar el sistema operativo en todos los nodos"
  hosts: cluster
  become: true
  tags: [prereqs]
  tasks:
    - name: "Instalar paquetes base"
      ansible.builtin.apt:
        name: [curl, tar, apt-transport-https]
        state: present
        update_cache: true

    - name: "Cargar el módulo SCTP (necesario para N2/NGAP y el vector A3)"
      # modprobe es idempotente: cargar un módulo ya cargado es un no-op.
      # Usamos shell puro para NO depender de ninguna colección externa.
      ansible.builtin.shell: "modprobe sctp && lsmod | grep -q '^sctp'"
      changed_when: false

    - name: "Hacer SCTP persistente entre reinicios"
      ansible.builtin.copy:
        dest: /etc/modules-load.d/sctp.conf
        content: "sctp\n"
        mode: "0644"

# =====================================================================
# PLAY 2 — k3s SERVER en el master (sin CNI ni kube-proxy: lo hace Cilium)
# =====================================================================
- name: "Instalar k3s server en el master"
  hosts: master
  become: true
  tags: [k3s]
  tasks:
    - name: "¿k3s ya instalado?"
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: "Instalar k3s server (flannel/kube-proxy/traefik desactivados)"
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_EXEC="server \
            --flannel-backend=none \
            --disable-network-policy \
            --disable-kube-proxy \
            --disable=traefik \
            --disable=servicelb \
            --write-kubeconfig-mode=644" \
          sh -
      when: not k3s_bin.stat.exists
      changed_when: true

    - name: "Esperar a que el API server responda"
      ansible.builtin.command: "k3s kubectl get --raw=/readyz"
      environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
      register: readyz
      retries: 30
      delay: 4
      until: readyz.rc == 0
      changed_when: false

    - name: "Leer el node-token (para unir a los workers)"
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_b64

    - name: "Guardar token e IP del master como hechos compartidos"
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_b64.content | b64decode | trim }}"
        master_ip: "{{ ansible_host | default(ansible_default_ipv4.address) }}"

# =====================================================================
# PLAY 3 — k3s AGENT en los workers (se unen al master)
# =====================================================================
- name: "Unir los workers al clúster"
  hosts: workers
  become: true
  tags: [k3s]
  tasks:
    - name: "¿k3s ya instalado en el worker?"
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_agent_bin

    - name: "Instalar k3s agent apuntando al master"
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_URL="https://{{ hostvars[groups['master'][0]].master_ip }}:6443" \
          K3S_TOKEN="{{ hostvars[groups['master'][0]].k3s_token }}" \
          sh -
      when: not k3s_agent_bin.stat.exists
      changed_when: true

# =====================================================================
# PLAY 4 — Componentes del clúster (se ejecutan EN el master)
# =====================================================================
- name: "Desplegar CNI, core 5G e identidad"
  hosts: master
  become: true
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  vars:
    repo_root: "{{ playbook_dir }}/.."
    work_dir: /tmp/cib46
  tasks:
    - name: "Crear directorio de trabajo en el master"
      ansible.builtin.file: { path: "{{ work_dir }}", state: directory, mode: "0755" }

    # ---------- Helm ----------
    - name: "¿Helm instalado?"
      ansible.builtin.command: "which helm"
      register: helm_check
      failed_when: false
      changed_when: false

    - name: "Instalar Helm"
      ansible.builtin.shell: "curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
      when: helm_check.rc != 0
      changed_when: true

    # ---------- Cilium (CNI + KPR + L7 + SCTP + Hubble) ----------
    - name: "Añadir repo Helm de Cilium"
      ansible.builtin.command: "helm repo add cilium https://helm.cilium.io"
      register: r
      changed_when: "'has been added' in r.stdout"
      failed_when: r.rc != 0 and 'already exists' not in r.stderr

    - name: "helm repo update"
      ansible.builtin.command: "helm repo update"
      changed_when: false

    - name: "Instalar/actualizar Cilium"
      ansible.builtin.command: >
        helm upgrade --install cilium cilium/cilium
        --version {{ cilium_version }}
        --namespace kube-system
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ master_ip }}
        --set k8sServicePort=6443
        --set l7Proxy=true
        --set sctp.enabled=true
        --set operator.replicas=1
        --set ipam.mode=cluster-pool
        --set hubble.enabled=true
        --set hubble.relay.enabled=true
        --set hubble.ui.enabled=true
      changed_when: true
      tags: [cilium]

    - name: "Esperar a que Cilium esté listo"
      ansible.builtin.command: "kubectl -n kube-system rollout status ds/cilium --timeout=300s"
      changed_when: false
      tags: [cilium]

    # ---------- Multus + NAD N2 ----------
    - name: "Instalar Multus (thick daemonset)"
      ansible.builtin.command: >
        kubectl apply -f
        https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/{{ multus_version }}/deployments/multus-daemonset-thick.yml
      changed_when: false
      tags: [multus]

    - name: "Crear namespaces"
      ansible.builtin.shell: "kubectl create ns {{ item }} --dry-run=client -o yaml | kubectl apply -f -"
      loop: ["{{ ns_cp }}", "{{ ns_ran }}", "{{ ns_up }}"]
      changed_when: false
      tags: [multus, namespaces]

    - name: "Crear NetworkAttachmentDefinition n2-net en RAN y CP"
      ansible.builtin.shell: |
        cat <<'EOF' | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: n2-net
          namespace: {{ item }}
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "type": "macvlan",
              "master": "{{ multus_master_iface }}",
              "mode": "bridge",
              "ipam": { "type": "static" }
            }
        EOF
      loop: ["{{ ns_ran }}", "{{ ns_cp }}"]
      changed_when: false
      tags: [multus]

    # ---------- metrics-server ----------
    - name: "Instalar metrics-server"
      ansible.builtin.command: >
        kubectl apply -f
        https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml
      changed_when: false
      tags: [metrics]

    - name: "Permitir kubelet-insecure-tls en metrics-server (testbed)"
      ansible.builtin.command: >
        kubectl -n kube-system patch deployment metrics-server --type=json
        -p=[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]
      register: msp
      failed_when: false
      changed_when: "'patched' in msp.stdout"
      tags: [metrics]

    # ---------- Open5GS (Helm) ----------
    - name: "Copiar values de Open5GS al master"
      ansible.builtin.copy:
        src: "{{ repo_root }}/helm-values/open5gs-values.yaml"
        dest: "{{ work_dir }}/open5gs-values.yaml"
        mode: "0644"
      tags: [open5gs]

    - name: "Añadir repo Helm towards5gs"
      ansible.builtin.command: "helm repo add towards5gs {{ towards5gs_repo_url }}"
      register: r5
      changed_when: "'has been added' in r5.stdout"
      failed_when: r5.rc != 0 and 'already exists' not in r5.stderr
      tags: [open5gs]

    - name: "helm repo update"
      ansible.builtin.command: "helm repo update"
      changed_when: false
      tags: [open5gs]

    - name: "Desplegar Open5GS"
      ansible.builtin.command: >
        helm upgrade --install open5gs {{ open5gs_chart }}
        --version {{ open5gs_chart_version }}
        --namespace {{ ns_cp }}
        -f {{ work_dir }}/open5gs-values.yaml
      changed_when: true
      tags: [open5gs]

    - name: "Esperar a que MongoDB esté listo"
      ansible.builtin.command: >
        kubectl -n {{ ns_cp }} wait --for=condition=Ready pod
        -l app.kubernetes.io/name=mongodb --timeout=240s
      changed_when: false
      tags: [open5gs, subscribers]

    # ---------- Suscriptor ----------
    - name: "Copiar script de suscriptores"
      ansible.builtin.copy:
        src: "{{ repo_root }}/helm-values/insert-subscribers.sh"
        dest: "{{ work_dir }}/insert-subscribers.sh"
        mode: "0755"
      tags: [subscribers]

    - name: "Insertar suscriptor de prueba"
      ansible.builtin.command: "bash {{ work_dir }}/insert-subscribers.sh"
      changed_when: true
      tags: [subscribers]

    # ---------- SPIRE (opcional, sin enforcement) ----------
    - name: "Copiar configs de SPIRE y manifiesto"
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ work_dir }}/{{ item.dst }}"
        mode: "0644"
      loop:
        - { src: "{{ repo_root }}/spire-config/server.conf", dst: "server.conf" }
        - { src: "{{ repo_root }}/spire-config/agent.conf", dst: "agent.conf" }
        - { src: "{{ repo_root }}/bootstrap/manifests/spire.yaml", dst: "spire.yaml" }
      when: deploy_spire | bool
      tags: [spire]

    - name: "Crear ConfigMaps de SPIRE"
      ansible.builtin.shell: |
        kubectl -n {{ ns_cp }} create configmap spire-server-conf --from-file=server.conf={{ work_dir }}/server.conf --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n {{ ns_cp }} create configmap spire-agent-conf --from-file=agent.conf={{ work_dir }}/agent.conf --dry-run=client -o yaml | kubectl apply -f -
      when: deploy_spire | bool
      changed_when: false
      tags: [spire]

    - name: "Aplicar SPIRE"
      ansible.builtin.command: "kubectl apply -f {{ work_dir }}/spire.yaml"
      when: deploy_spire | bool
      changed_when: false
      tags: [spire]

    # ---------- UERANSIM (gNB + UE) ----------
    - name: "Copiar configs UERANSIM y manifiesto"
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ work_dir }}/{{ item.dst }}"
        mode: "0644"
      loop:
        - { src: "{{ repo_root }}/ueransim-config/gnb.yaml", dst: "gnb.yaml" }
        - { src: "{{ repo_root }}/ueransim-config/ue.yaml", dst: "ue.yaml" }
        - { src: "{{ repo_root }}/bootstrap/manifests/ueransim.yaml", dst: "ueransim.yaml" }
      tags: [ueransim]

    - name: "Crear ConfigMaps de UERANSIM"
      ansible.builtin.shell: |
        kubectl -n {{ ns_ran }} create configmap ueransim-gnb-conf --from-file=gnb.yaml={{ work_dir }}/gnb.yaml --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n {{ ns_ran }} create configmap ueransim-ue-conf --from-file=ue.yaml={{ work_dir }}/ue.yaml --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false
      tags: [ueransim]

    - name: "Aplicar gNB + UE"
      ansible.builtin.command: "kubectl apply -f {{ work_dir }}/ueransim.yaml"
      changed_when: false
      tags: [ueransim]

    - name: "Mensaje final"
      ansible.builtin.debug:
        msg: >
          Testbed desplegado. Aplica la condición baseline con los overlays
          Kustomize (ver README-ansible.md §8) y valida con la prueba de humo
          del plano de control.
