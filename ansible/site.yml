# site.yml — Despliegue completo del testbed CIB46 con Ansible (lab v2).
#
# Describe el estado deseado del clúster y lo consigue de forma idempotente
# (puedes re-ejecutarlo sin romper nada).
#
# Uso (desde la carpeta ansible/):
#   ansible-playbook site.yml -K              # todo (-K pide la clave de sudo)
#   ansible-playbook site.yml -K --tags cilium   # solo una parte
#
# Guía paso a paso desde VMs vacías: docs/guia-lab-desde-cero.md
#
# Cambios lab v2 (resumen; detalle en la guía):
#   - k3s con --node-ip explícito (evita que tome otra NIC).
#   - Cilium con pool de pods 10.42.0.0/16 y CLIs cilium/hubble en el master.
#   - Open5GS desde el chart OCI de Gradiant (towards5gs no tiene chart de
#     Open5GS), release "open5gs-cp", suscriptor vía populate del chart.
#   - N2 por la red de pods de Cilium (Multus opcional y apagado): así las
#     políticas C1-C3 ven el tráfico N2. El gNB llega al AMF por un Service
#     headless (Cilium 1.15 no soporta SCTP sobre VIP con KPR).
#   - UERANSIM con rutas de binario correctas e IP del pod inyectada.
#   - SPIRE integrado en Cilium (mutual authentication): Cilium lo instala en
#     cilium-spire con el trust domain de la tesis y el playbook verifica que
#     cada identidad de Cilium tenga su SVID. Sustituye al SPIRE autónomo de
#     la v1 (bootstrap/manifests/spire.yaml), que no podía atestar agentes.
---

# =====================================================================
# PLAY 1 — Preparación del host (TODOS los nodos)
# =====================================================================
- name: "Preparar el sistema operativo en todos los nodos"
  hosts: cluster
  become: true
  tags: [prereqs]
  tasks:
    - name: "Instalar paquetes base"
      ansible.builtin.apt:
        name: [curl, tar, apt-transport-https]
        state: present
        update_cache: true

    - name: "Cargar el módulo SCTP (necesario para N2/NGAP y el vector A3)"
      ansible.builtin.shell: "modprobe sctp && lsmod | grep -q '^sctp'"
      changed_when: false

    - name: "Hacer SCTP persistente entre reinicios"
      ansible.builtin.copy:
        dest: /etc/modules-load.d/sctp.conf
        content: "sctp\n"
        mode: "0644"

    - name: "Desactivar swap ahora (Kubernetes lo recomienda)"
      ansible.builtin.command: "swapoff -a"
      changed_when: false

    - name: "Desactivar swap de forma persistente (comenta la línea en fstab)"
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

# =====================================================================
# PLAY 2 — k3s SERVER en el master (sin CNI ni kube-proxy: lo hace Cilium)
# =====================================================================
- name: "Instalar k3s server en el master"
  hosts: master
  become: true
  tags: [k3s]
  tasks:
    - name: "¿k3s ya instalado?"
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: "Instalar k3s server (flannel/kube-proxy/traefik desactivados)"
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_EXEC="server \
            --node-ip={{ ansible_host }} \
            --flannel-backend=none \
            --disable-network-policy \
            --disable-kube-proxy \
            --disable=traefik \
            --disable=servicelb \
            --write-kubeconfig-mode=644" \
          sh -
      when: not k3s_bin.stat.exists
      changed_when: true

    - name: "Esperar a que el API server responda"
      ansible.builtin.command: "k3s kubectl get --raw=/readyz"
      environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
      register: readyz
      retries: 30
      delay: 4
      until: readyz.rc == 0
      changed_when: false

    - name: "Crear ~/.kube del usuario"
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: "Dejar el kubeconfig en el HOME del usuario (kubectl/helm sin sudo)"
      ansible.builtin.copy:
        src: "{{ kubeconfig_path }}"
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: "Leer el node-token (para unir a los workers)"
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_b64

    - name: "Guardar token e IP del master como hechos compartidos"
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_b64.content | b64decode | trim }}"
        master_ip: "{{ ansible_host }}"

# =====================================================================
# PLAY 3 — k3s AGENT en los workers (se unen al master)
# =====================================================================
- name: "Unir los workers al clúster"
  hosts: workers
  become: true
  tags: [k3s]
  tasks:
    - name: "¿k3s ya instalado en el worker?"
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_agent_bin

    - name: "Instalar k3s agent apuntando al master"
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_URL="https://{{ hostvars[groups['master'][0]].master_ip }}:6443" \
          K3S_TOKEN="{{ hostvars[groups['master'][0]].k3s_token }}" \
          INSTALL_K3S_EXEC="agent --node-ip={{ ansible_host }}" \
          sh -
      when: not k3s_agent_bin.stat.exists
      changed_when: true

# =====================================================================
# PLAY 4 — Componentes del clúster (se ejecutan EN el master)
# =====================================================================
- name: "Desplegar CNI, core 5G y RAN simulada"
  hosts: master
  become: true
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  vars:
    repo_root: "{{ playbook_dir }}/.."
    work_dir: /tmp/cib46
  tasks:
    - name: "Crear directorio de trabajo en el master"
      ansible.builtin.file: { path: "{{ work_dir }}", state: directory, mode: "0755" }
      tags: [always]

    # ---------- Helm ----------
    - name: "¿Helm instalado?"
      ansible.builtin.command: "which helm"
      register: helm_check
      failed_when: false
      changed_when: false
      tags: [always]

    - name: "Instalar Helm 3"
      ansible.builtin.shell: "curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
      when: helm_check.rc != 0
      changed_when: true
      tags: [always]

    # ---------- Cilium (CNI + KPR + L7 + SCTP + Hubble) ----------
    - name: "Añadir repo Helm de Cilium"
      ansible.builtin.command: "helm repo add cilium https://helm.cilium.io"
      register: r
      changed_when: "'has been added' in r.stdout"
      failed_when: r.rc != 0 and 'already exists' not in r.stderr
      tags: [cilium]

    - name: "helm repo update"
      ansible.builtin.command: "helm repo update"
      changed_when: false
      tags: [cilium]

    - name: "Instalar/actualizar Cilium"
      ansible.builtin.command: >
        helm upgrade --install cilium cilium/cilium
        --version {{ cilium_version }}
        --namespace kube-system
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ ansible_host }}
        --set k8sServicePort=6443
        --set l7Proxy=true
        --set sctp.enabled=true
        --set operator.replicas=1
        --set ipam.mode=cluster-pool
        --set ipam.operator.clusterPoolIPv4PodCIDRList={ {{- cilium_pod_cidr -}} }
        --set hubble.enabled=true
        --set hubble.relay.enabled=true
        --set hubble.ui.enabled=true
        {% if deploy_spire | bool %}
        --set authentication.mutual.spire.enabled=true
        --set authentication.mutual.spire.install.enabled=true
        --set authentication.mutual.spire.trustDomain={{ spire_trust_domain }}
        {% endif %}
      changed_when: true
      tags: [cilium, spire]

    - name: "Esperar a que Cilium esté listo en todos los nodos"
      ansible.builtin.command: "kubectl -n kube-system rollout status ds/cilium --timeout=300s"
      changed_when: false
      tags: [cilium]

    - name: "Esperar a que los nodos estén Ready"
      ansible.builtin.command: "kubectl wait --for=condition=Ready nodes --all --timeout=300s"
      changed_when: false
      tags: [cilium]

    # ---------- SPIRE (instalado por Cilium en cilium-spire) ----------
    - name: "Esperar al SPIRE server (StatefulSet con PVC de local-path)"
      ansible.builtin.command: "kubectl -n cilium-spire rollout status statefulset/spire-server --timeout=600s"
      when: deploy_spire | bool
      changed_when: false
      tags: [cilium, spire]

    - name: "Esperar a los SPIRE agents (uno por nodo)"
      ansible.builtin.command: "kubectl -n cilium-spire rollout status daemonset/spire-agent --timeout=300s"
      when: deploy_spire | bool
      changed_when: false
      tags: [cilium, spire]

    - name: "Healthcheck del SPIRE server"
      ansible.builtin.command: >
        kubectl -n cilium-spire exec spire-server-0 -c spire-server --
        /opt/spire/bin/spire-server healthcheck
      register: spire_health
      retries: 20
      delay: 6
      until: "'Server is healthy' in spire_health.stdout"
      when: deploy_spire | bool
      changed_when: false
      tags: [cilium, spire]

    - name: "¿El operador de Cilium ya registró identidades en SPIRE?"
      ansible.builtin.command: >
        kubectl -n cilium-spire exec spire-server-0 -c spire-server --
        /opt/spire/bin/spire-server entry show -selector cilium:mutual-auth
      register: spire_entries
      failed_when: false
      changed_when: false
      when: deploy_spire | bool
      tags: [cilium, spire]

    # La doc de Cilium pide reiniciar operador y agentes tras activar SPIRE:
    # si arrancaron antes de que SPIRE estuviera listo, no registran nada.
    - name: "Reiniciar operador y agentes de Cilium (solo si SPIRE aún no tiene entradas)"
      ansible.builtin.shell: |
        kubectl -n kube-system rollout restart deployment/cilium-operator
        kubectl -n kube-system rollout restart daemonset/cilium
        kubectl -n kube-system rollout status deployment/cilium-operator --timeout=300s
        kubectl -n kube-system rollout status daemonset/cilium --timeout=300s
      when:
        - deploy_spire | bool
        - spire_entries.stdout is not search('Found [1-9]')
      changed_when: true
      tags: [cilium, spire]

    - name: "Verificar que cada identidad de Cilium tiene su entrada SPIFFE"
      ansible.builtin.command: >
        kubectl -n cilium-spire exec spire-server-0 -c spire-server --
        /opt/spire/bin/spire-server entry show -selector cilium:mutual-auth
      register: spire_entries2
      retries: 20
      delay: 6
      until: spire_entries2.stdout is search('Found [1-9]')
      when: deploy_spire | bool
      changed_when: false
      tags: [cilium, spire]

    # ---------- CLIs de observabilidad (cilium, hubble) ----------
    - name: "Instalar cilium CLI y hubble CLI en el master"
      ansible.builtin.shell: |
        set -e
        cd /tmp
        if ! command -v cilium >/dev/null; then
          curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-amd64.tar.gz{,.sha256sum}
          sha256sum --check cilium-linux-amd64.tar.gz.sha256sum
          tar xzf cilium-linux-amd64.tar.gz -C /usr/local/bin
        fi
        if ! command -v hubble >/dev/null; then
          curl -L --fail --remote-name-all https://github.com/cilium/hubble/releases/download/{{ hubble_cli_version }}/hubble-linux-amd64.tar.gz{,.sha256sum}
          sha256sum --check hubble-linux-amd64.tar.gz.sha256sum
          tar xzf hubble-linux-amd64.tar.gz -C /usr/local/bin
        fi
      args: { executable: /bin/bash }
      changed_when: false
      tags: [tools]

    # ---------- Namespaces ----------
    - name: "Crear namespaces"
      ansible.builtin.shell: "kubectl create ns {{ item }} --dry-run=client -o yaml | kubectl apply -f -"
      loop: ["{{ ns_cp }}", "{{ ns_ran }}", "{{ ns_up }}"]
      changed_when: false
      tags: [namespaces, open5gs, ueransim]

    # ---------- Multus + NAD N2 (OPCIONAL, apagado en lab v2) ----------
    - name: "Instalar Multus (thick daemonset)"
      ansible.builtin.command: >
        kubectl apply -f
        https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/{{ multus_version }}/deployments/multus-daemonset-thick.yml
      when: deploy_multus | bool
      changed_when: false
      tags: [multus]

    - name: "Crear NetworkAttachmentDefinition n2-net en RAN y CP"
      ansible.builtin.shell: |
        cat <<'EOF' | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: n2-net
          namespace: {{ item }}
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "type": "macvlan",
              "master": "{{ multus_master_iface }}",
              "mode": "bridge",
              "ipam": { "type": "static" }
            }
        EOF
      loop: ["{{ ns_ran }}", "{{ ns_cp }}"]
      when: deploy_multus | bool
      changed_when: false
      tags: [multus]

    # ---------- metrics-server ----------
    - name: "Instalar metrics-server"
      ansible.builtin.command: >
        kubectl apply -f
        https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml
      changed_when: false
      tags: [metrics]

    - name: "¿metrics-server ya tiene --kubelet-insecure-tls?"
      ansible.builtin.command: >
        kubectl -n kube-system get deployment metrics-server
        -o jsonpath={.spec.template.spec.containers[0].args}
      register: ms_args
      changed_when: false
      tags: [metrics]

    - name: "Permitir kubelet-insecure-tls en metrics-server (testbed)"
      ansible.builtin.command: >
        kubectl -n kube-system patch deployment metrics-server --type=json
        -p=[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]
      when: "'kubelet-insecure-tls' not in ms_args.stdout"
      changed_when: true
      tags: [metrics]

    # ---------- Open5GS (chart OCI de Gradiant) ----------
    - name: "Copiar values de Open5GS al master"
      ansible.builtin.copy:
        src: "{{ repo_root }}/helm-values/open5gs-values.yaml"
        dest: "{{ work_dir }}/open5gs-values.yaml"
        mode: "0644"
      tags: [open5gs]

    - name: "Desplegar Open5GS (espera a que todo esté listo, hasta 15 min)"
      ansible.builtin.command: >
        helm upgrade --install {{ open5gs_release }} {{ open5gs_chart }}
        --version {{ open5gs_chart_version }}
        --namespace {{ ns_cp }}
        -f {{ work_dir }}/open5gs-values.yaml
        --wait --timeout 15m
      changed_when: true
      tags: [open5gs]

    - name: "Esperar a que MongoDB esté listo"
      ansible.builtin.command: >
        kubectl -n {{ ns_cp }} wait --for=condition=Ready pod
        -l app.kubernetes.io/name=mongodb --timeout=240s
      changed_when: false
      tags: [open5gs, subscribers]

    # ---------- Suscriptor (lo inserta el 'populate' del chart) ----------
    - name: "Esperar a que el populate haya insertado el suscriptor"
      ansible.builtin.command: >
        kubectl -n {{ ns_cp }} rollout status
        deployment/{{ open5gs_release }}-populate --timeout=300s
      changed_when: false
      tags: [open5gs, subscribers]

    # ---------- Service headless N2 del AMF ----------
    - name: "Copiar y aplicar el Service headless N2 del AMF"
      ansible.builtin.copy:
        src: "{{ repo_root }}/bootstrap/manifests/amf-n2-headless.yaml"
        dest: "{{ work_dir }}/amf-n2-headless.yaml"
        mode: "0644"
      tags: [open5gs, ueransim]

    - name: "Aplicar amf-n2-headless.yaml"
      ansible.builtin.command: "kubectl apply -f {{ work_dir }}/amf-n2-headless.yaml"
      changed_when: false
      tags: [open5gs, ueransim]

    # ---------- UERANSIM (gNB + UE) ----------
    - name: "Copiar configs UERANSIM y manifiesto"
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ work_dir }}/{{ item.dst }}"
        mode: "0644"
      loop:
        - { src: "{{ repo_root }}/ueransim-config/gnb.yaml", dst: "gnb.yaml" }
        - { src: "{{ repo_root }}/ueransim-config/ue.yaml", dst: "ue.yaml" }
        - { src: "{{ repo_root }}/bootstrap/manifests/ueransim.yaml", dst: "ueransim.yaml" }
      tags: [ueransim]

    - name: "Crear ConfigMaps de UERANSIM"
      ansible.builtin.shell: |
        kubectl -n {{ ns_ran }} create configmap ueransim-gnb-conf --from-file=gnb.yaml={{ work_dir }}/gnb.yaml --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n {{ ns_ran }} create configmap ueransim-ue-conf --from-file=ue.yaml={{ work_dir }}/ue.yaml --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false
      tags: [ueransim]

    - name: "Aplicar gNB + UE"
      ansible.builtin.command: "kubectl apply -f {{ work_dir }}/ueransim.yaml"
      changed_when: false
      tags: [ueransim]

    - name: "Esperar a gNB y UE"
      ansible.builtin.command: "kubectl -n {{ ns_ran }} rollout status deployment/{{ item }} --timeout=300s"
      loop: [ueransim-gnb, ueransim-ues]
      changed_when: false
      tags: [ueransim]

    - name: "Mensaje final"
      ansible.builtin.debug:
        msg: >
          Testbed desplegado. Sigue la sección de verificación de
          docs/guia-lab-desde-cero.md (logs del gNB/UE, uesimtun0) y aplica C0
          con 'make condition C=c0' + 'make smoke C=C0'.
      tags: [always]
