name: Seguridad CI/CD (Zero Trust supply-chain)

# Controles de seguridad de la cadena de suministro y de la configuración, en
# línea con el enfoque Zero Trust del testbed:
#   - Secretos: gitleaks (BLOQUEA).
#   - Seguridad de los propios workflows: actionlint (BLOQUEA) + zizmor.
#   - Misconfiguraciones IaC/K8s: trivy, checkov, kube-linter (informativos:
#     el testbed usa privilegios elevados a propósito; se reportan, no se gatean).

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"   # lunes 06:00 UTC: barrido semanal
  workflow_dispatch:

# Mínimo privilegio por defecto para todo el workflow.
permissions:
  contents: read

concurrency:
  group: sec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.18.4
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Instalar gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Escaneo de secretos (BLOQUEA)
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose

  actions-security:
    name: Seguridad de workflows (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Instalar shellcheck (para actionlint)
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Instalar actionlint
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint --version
      - name: actionlint (BLOQUEA)
        run: actionlint -color
      - name: zizmor (auditoría de seguridad de Actions, informativo)
        run: |
          pipx install zizmor || pip install --user zizmor
          zizmor --no-online-audits .github/workflows || true

  iac-scan:
    name: IaC / K8s (trivy + checkov + kube-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIVY_VERSION: 0.76.0
      KUBELINTER_VERSION: 0.6.8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Instalar trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version
      - name: trivy config (misconfiguraciones IaC, informativo)
        run: trivy config --severity HIGH,CRITICAL --exit-code 0 .
      - name: checkov (IaC/K8s, informativo)
        run: |
          pipx install checkov || pip install --user checkov
          checkov -d . --compact --quiet --soft-fail
      - name: Instalar kube-linter
        run: |
          curl -sSfL "https://github.com/stackrox/kube-linter/releases/download/v${KUBELINTER_VERSION}/kube-linter-linux.tar.gz" \
            | tar -xz -C /usr/local/bin kube-linter
          kube-linter version
      - name: kube-linter (manifiestos y políticas, informativo)
        run: |
          kube-linter lint bootstrap/manifests attack-scripts \
            cilium-policies --fail-if-no-objects-found=false || true
