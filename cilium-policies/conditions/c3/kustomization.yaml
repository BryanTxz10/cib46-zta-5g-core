# Condición C3 — C2 endurecida + autorización L7 por rol.
# Reemplaza 'allow-sbi-legit-nfs-only' por 'allow-sbi-rbac-c3' (L7).
# Hereda todo el hardening de C1/C2.
# allow-sbi-core-nf cubre la SBI que no va al NRF (AMF->SCP, SCP->UDM...): sin
# ella, con 5g-cp en default-deny, el attach se rompe tras un reinicio limpio.
#
# Aplicar:
#   kustomize build --load-restrictor=LoadRestrictionsNone \
#     cilium-policies/conditions/c3 | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  cib46.io/managed: "true"
resources:
  - ../../hardening/ingress/00-default-deny-cp.yaml
  - ../../c1/03-allow-gnb-to-amf-n2.yaml
  - ../../hardening/ingress/01-allow-mongodb-udr-pcf.yaml
  - ../../hardening/ingress/02-allow-upf-n3-n4.yaml
  - ../../hardening/egress/00-egress-cp-baseline.yaml
  - ../../hardening/egress/01-egress-upf-n6.yaml
  - ../../hardening/egress/02-egress-ran-baseline.yaml
  - ../../hardening/egress/03-egress-smf-n4.yaml
  - ../../c3/01-allow-sbi-rbac-c3.yaml
  - ../../c2/03-allow-sbi-core-nf.yaml
