# c0-allow-all-anchor.yaml
# Condicion C0 (baseline sin controles ZTA).
#
# C0 = "cero politicas de segmentacion, identidad o autorizacion". Se mantiene
# una politica ancla por namespace (declarativa y visible en kubectl) que
# permite TODO el trafico de entrada y salida.
#
# CORRECCION lab v2 (importante):
#   La version anterior usaba
#       ingress: [ {} ]
#       egress:  [ {} ]
#   En CiliumNetworkPolicy eso NO es allow-all (esa es la semantica de la
#   NetworkPolicy de Kubernetes). En Cilium una regla vacia activa el modo
#   default-deny sin permitir nada: es el patron "deny-all" de los ejemplos
#   oficiales (examples/policies/l3/egress-default-deny/ en cilium v1.15.4).
#   Aplicada, cortaba DNS, SBI, N2 y N3 en los tres namespaces.
#   El allow-all correcto en Cilium es por entidades: fromEntities/toEntities
#   "all" (cualquier endpoint del cluster, el host y el exterior).
#
# Nota: Cilium no necesita ninguna politica para permitir trafico (sin
# politicas, todo esta permitido). El ancla existe solo para que las
# transiciones entre condiciones sean declarativas y auditables.

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: c0-allow-all-anchor
  namespace: 5g-cp
spec:
  endpointSelector: {}
  ingress:
    - fromEntities: [all]
  egress:
    - toEntities: [all]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: c0-allow-all-anchor
  namespace: 5g-ran
spec:
  endpointSelector: {}
  ingress:
    - fromEntities: [all]
  egress:
    - toEntities: [all]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: c0-allow-all-anchor
  namespace: 5g-up
spec:
  endpointSelector: {}
  ingress:
    - fromEntities: [all]
  egress:
    - toEntities: [all]
