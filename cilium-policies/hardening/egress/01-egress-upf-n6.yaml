# 01-egress-upf-n6.yaml
# Arquitectura v3 — Hallazgo 1 (N6 colapsado) + separación de planos.
#
# Default-deny de EGRESS sobre todo 5g-up. El UPF solo puede:
#   - N3 de bajada: GTP-U hacia el gNB.
#   - N6: salir a `world` (internet de los suscriptores).
#
# POR QUÉ TAN CORTO. El UPF hace NAT del tráfico de los UE: lo que un teléfono
# envía sale del pod con la identidad del UPF. Por eso TODO lo que se le
# permita al UPF se le permite a cada suscriptor. `world` es lo externo al
# clúster; pods, nodos y el API server quedan fuera. Un UE que intente llegar
# a la SBI, a MongoDB o al API de Kubernetes por la puerta N6 muere aquí, y
# Hubble muestra el DROPPED.
#
# DELIBERADAMENTE no hay:
#   - DNS del clúster: los UE usan el DNS que les da el SMF (8.8.8.8, en
#     world). Con DNS permitido, un teléfono podría enumerar los Services.
#   - Regla hacia el SMF: N4 lo inicia siempre el SMF; las respuestas, los
#     heartbeats y los reportes PFCP del UPF vuelven por esa misma conexión
#     (conntrack, mismos puertos 8805<->8805). Una regla UPF->SMF:8805 dejaría
#     a un UE enviar PFCP falso al SMF.
#     Si en tu lab la asociación PFCP se cae tras estar inactiva (en los logs
#     del SMF: "No Heartbeat from UPF"), descomenta la regla del final y
#     decláralo como límite: en un operador N4 y N6 son interfaces y VRF
#     distintas, aquí comparten la única interfaz del pod.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-upf-n6
  namespace: 5g-up
spec:
  endpointSelector: {}
  egress:
    # N3 de bajada: UPF -> gNB (GTP-U).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: 5g-ran
            app.kubernetes.io/name: ueransim-gnb
      toPorts:
        - ports:
            - { port: "2152", protocol: UDP }
    # N6: salida de los suscriptores a internet. 'world' = todo lo externo al
    # clúster; NO incluye pods, nodos ni el API server.
    - toEntities:
        - world
    # (Opcional, ver nota de cabecera) N4 iniciado por el UPF:
    # - toEndpoints:
    #     - matchLabels:
    #         io.kubernetes.pod.namespace: 5g-cp
    #         app.kubernetes.io/name: smf
    #   toPorts:
    #     - ports:
    #         - { port: "8805", protocol: UDP }
