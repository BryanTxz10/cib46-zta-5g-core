# 02-allow-upf-n3-n4.yaml
# Arquitectura v3 — zona de confianza del PLANO DE USUARIO (namespace 5g-up).
#
# Default-deny de INGRESS sobre todo 5g-up: solo se admite
#   - N3 (GTP-U, UDP 2152) desde el gNB de 5g-ran.
#   - N4 (PFCP, UDP 8805) desde el SMF de 5g-cp.
# El atacante de 5g-ran no puede inyectar GTP-U al UPF (no lleva el label del
# gNB) y ningún otro pod puede hablar PFCP con él.
#
# Equivale a lo que hace un operador con el UPF de borde: N3 llega por la red
# de acceso desde la radio y N4 por la red de transporte desde el SMF del
# sitio central; nada más entra a la zona de usuario.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-upf-n3-n4
  namespace: 5g-up
spec:
  endpointSelector: {}
  ingress:
    # N3: GTP-U desde el gNB.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: 5g-ran
            app.kubernetes.io/name: ueransim-gnb
      toPorts:
        - ports:
            - { port: "2152", protocol: UDP }
    # N4: PFCP desde el SMF.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: 5g-cp
            app.kubernetes.io/name: smf
      toPorts:
        - ports:
            - { port: "8805", protocol: UDP }
