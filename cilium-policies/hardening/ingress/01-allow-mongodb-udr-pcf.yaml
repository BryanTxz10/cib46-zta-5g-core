# 01-allow-mongodb-udr-pcf.yaml
# HARDENING — Hallazgo 7 (MongoDB sin autenticación).
#
# REEMPLAZA a c1/04-deny-ran-to-mongodb.yaml (que admitía a TODO 5g-cp).
# Restringe el ingress a MongoDB (27017) a SOLO lo que usa la base de
# suscriptores en Open5GS:
#   - UDR (datos de suscriptor) y PCF (políticas): son las únicas NF del chart
#     que reciben DB_URI. El BSF no usa la base.
#   - populate: el Deployment del chart que inserta el suscriptor. Hace falta
#     aquí porque MongoDB no es persistente en el testbed: tras un reinicio hay
#     que reinsertar el suscriptor (`make subscribers`) con la condición ya
#     aplicada. Equivale al sistema de aprovisionamiento de un operador.
# Un pod impostor o comprometido de 5g-cp, aunque tenga el label de identidad,
# no alcanza la bóveda de claves K/OPc.
#
# VALIDAR con `make smoke`: si una NF legítima no llega a la base, Hubble
# muestra el DROPPED hacia mongodb:27017 y se añade su label aquí.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mongodb-udr-pcf
  namespace: 5g-cp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: 5g-cp
            app.kubernetes.io/name: udr
        - matchLabels:
            io.kubernetes.pod.namespace: 5g-cp
            app.kubernetes.io/name: pcf
        - matchLabels:
            io.kubernetes.pod.namespace: 5g-cp
            app.kubernetes.io/component: populate
      toPorts:
        - ports:
            - { port: "27017", protocol: TCP }
