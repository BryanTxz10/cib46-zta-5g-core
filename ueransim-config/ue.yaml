# ue.yaml
# Configuracion del UE simulado con UERANSIM v3.2.6.
# El IMSI y las claves de seguridad deben coincidir exactamente con el
# perfil de suscriptor insertado en MongoDB
# (lab v2: populate.initCommands en ../helm-values/open5gs-values.yaml).

supi: 'imsi-999700000000001'
mcc: '999'
mnc: '70'

key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
op: 'E8ED289DEBA952E4283B54E88E6183CA'
opType: 'OPC'
amf: '8000'
imei: '356938035643803'
imeiSv: '4370816125816151'

# Dónde busca el UE al gNB (protocolo RLS, UDP 4997). Debe ser el gNB, no el
# AMF. Service headless definido en bootstrap/manifests/ueransim.yaml.
gnbSearchList:
  - ueransim-gnb.5g-ran.svc.cluster.local

uacAic:
  mps: false
  mcs: false

uacAcc:
  normalClass: 0
  class11: false
  class12: false
  class13: false
  class14: false
  class15: false

sessions:
  - type: 'IPv4'
    apn: 'internet'
    slice:
      sst: 1
      sd: 0x111111

configured-nssai:
  - sst: 1
    sd: 0x111111

default-nssai:
  - sst: 1
    sd: 0x111111

integrity:
  IA1: true
  IA2: true
  IA3: true

ciphering:
  EA1: true
  EA2: true
  EA3: true

integrityMaxRate:
  uplink: 'full'
  downlink: 'full'
