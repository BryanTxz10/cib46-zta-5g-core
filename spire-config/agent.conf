# ============================================================================
# LEGADO v1 — NO SE USA EN LAB v2.
# En lab v2 SPIRE lo instala y gestiona Cilium (mutual authentication) en el
# namespace cilium-spire, con trust domain cib46.5gcore.local; ver
# ansible/site.yml y docs/guia-lab-desde-cero.md (sección SPIRE).
# Se conserva solo por trazabilidad con la tesis v1. Motivo del reemplazo:
# el NodeAttestor solo admitía el SA "spire:spire-agent" pero el agente corría
# en 5g-cp, no había entradas de registro y ninguna política consumía SVIDs.
# ============================================================================
# agent.conf
# Configuracion de SPIRE Agent v1.9.0, desplegado como DaemonSet en
# cada nodo worker del cluster. Ver nota de limitacion en server.conf:
# SPIRE permanece activo pero sin enforcement efectivo sobre el trafico
# SBI de Open5GS v2.7.

agent {
    data_dir = "/run/spire"
    log_level = "INFO"
    server_address = "spire-server.5g-cp.svc.cluster.local"
    server_port = "8081"
    trust_domain = "cib46.5gcore.local"
}

plugins {
    NodeAttestor "k8s_psat" {
        plugin_data {
            cluster = "cib46-testbed"
        }
    }

    KeyManager "memory" {
        plugin_data {}
    }

    WorkloadAttestor "k8s" {
        plugin_data {
            skip_kubelet_verification = true
        }
    }
}
