# server.conf
# Configuracion de SPIRE Server v1.9.0.
#
# NOTA IMPORTANTE (limitacion documentada en el capitulo de discusion):
# Open5GS v2.7 no expone SVIDs en su trafico SBI interno (HTTP/2
# cleartext sin soporte SPIFFE nativo). SPIRE se despliega desde la
# condicion C0 y permanece activo durante todo el experimento, pero NO
# ejerce enforcement en ninguna condicion evaluada. La identidad de
# workload de las condiciones C2 y C3 se implementa mediante
# CiliumNetworkPolicy con selectores fromEndpoints sobre labels de pod
# verificados por el dataplane eBPF (ver ../cilium-policies/c2/), no
# mediante los SVID X.509 que emite este SPIRE Server.
#
# Este archivo se conserva por completitud y trazabilidad del intento
# de implementacion mTLS descartado (hallazgos H10/H21).

server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "cib46.5gcore.local"
    data_dir = "/run/spire/data"
    log_level = "INFO"
    default_x509_svid_ttl = "1h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }

    NodeAttestor "k8s_psat" {
        plugin_data {
            clusters = {
                "cib46-testbed" = {
                    service_account_allow_list = ["spire:spire-agent"]
                }
            }
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/data/keys.json"
        }
    }
}
